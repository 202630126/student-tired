<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 학생 피로도 진단 & 맞춤 솔루션 매니저</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #50E3C2;
            --bg-color: #F4F7F6;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --text-muted: #666666;
            --border-color: #E0E0E0;
            --danger-color: #FF5A5F;
            --warning-color: #FFAA00;
            --success-color: #2ECC71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
        }

        .range-value {
            font-weight: bold;
            min-width: 55px;
            text-align: right;
            color: var(--primary-color);
        }

        /* Results Display */
        .result-card {
            background: #F8FAFC;
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            border: 1px solid var(--border-color);
        }

        .score-bar-container {
            margin-bottom: 15px;
        }

        .score-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .progress-bg {
            height: 12px;
            background-color: #E2E8F0;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            transition: width 0.6s ease-in-out;
            border-radius: 6px;
        }

        /* AI Custom Solution Box */
        .solution-card {
            background-color: #FFFFFF;
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.1);
        }

        .solution-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .solution-tag {
            background-color: var(--primary-color);
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .solution-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2C3E50;
        }

        .solution-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #4A5568;
            margin-bottom: 15px;
        }

        .refresh-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--secondary-color);
            color: #064E3B;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .refresh-btn:hover {
            background-color: #38D9A9;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AI 학생 피로도 진단 & 맞춤 솔루션</h1>
        <p>수면, 컨디션, 수업 상태를 종합 분석하여 다채로운 AI 피로 개선책을 제시합니다.</p>
    </header>

    <!-- 입력 슬라이더 영역 -->
    <div class="form-group">
        <label>① 수면 시간 (시간)</label>
        <div class="range-container">
            <input type="range" id="sleep-time" min="3" max="12" value="6" oninput="calculateFatigue()">
            <span class="range-value" id="sleep-val">6시간</span>
        </div>
    </div>

    <div class="form-group">
        <label>② 아침 기분 / 컨디션 (1 = 매우 피곤 ~ 10 = 매우 최상)</label>
        <div class="range-container">
            <input type="range" id="morning-cond" min="1" max="10" value="4" oninput="calculateFatigue()">
            <span class="range-value" id="morning-val">4점</span>
        </div>
    </div>

    <div class="form-group">
        <label>③ 현재 교시 (1~7교시)</label>
        <div class="range-container">
            <input type="range" id="current-period" min="1" max="7" value="4" oninput="calculateFatigue()">
            <span class="range-value" id="period-val">4교시</span>
        </div>
    </div>

    <div class="form-group">
        <label>④ 과목 정신적 난이도 (1 = 매우 쉬움 ~ 10 = 매우 어려움)</label>
        <div class="range-container">
            <input type="range" id="mental-load" min="1" max="10" value="8" oninput="calculateFatigue()">
            <span class="range-value" id="mental-load-val">8점</span>
        </div>
    </div>

    <div class="form-group">
        <label>⑤ 수업 체력 소모도 (1 = 휴식 수준 ~ 10 = 격렬한 운동)</label>
        <div class="range-container">
            <input type="range" id="physical-load" min="1" max="10" value="6" oninput="calculateFatigue()">
            <span class="range-value" id="physical-load-val">6점</span>
        </div>
    </div>

    <!-- 피로도 점수 출력 카드 -->
    <div class="result-card">
        <h3>📊 실시간 피로도 진단 결과</h3>
        <br>
        <div class="score-bar-container">
            <div class="score-header">
                <span>신체적 피로도</span>
                <span id="physical-score-text">0점</span>
            </div>
            <div class="progress-bg">
                <div class="progress-fill" id="physical-bar"></div>
            </div>
        </div>

        <div class="score-bar-container">
            <div class="score-header">
                <span>정신적 피로도</span>
                <span id="mental-score-text">0점</span>
            </div>
            <div class="progress-bg">
                <div class="progress-fill" id="mental-bar"></div>
            </div>
        </div>
    </div>

    <!-- AI 다양한 처방 카드 -->
    <div class="solution-card">
        <div class="solution-header">
            <span class="solution-tag" id="sol-tag">AI 처방</span>
            <span class="solution-title" id="sol-title">원인 분석 중...</span>
        </div>
        <div class="solution-body" id="sol-body">
            슬라이더를 조절하면 AI가 원인을 다각도로 분석하여 최적의 솔루션을 제공합니다.
        </div>
        <button class="refresh-btn" onclick="applyRefreshAction()">⚡ 2분 맞춤 리프레시 수행하기 (피로도 감소)</button>
    </div>
</div>

<script>
    function calculateFatigue() {
        // 입력값 수집 및 단위 표시 업데이트
        const sleep = parseInt(document.getElementById('sleep-time').value);
        const morning = parseInt(document.getElementById('morning-cond').value);
        const period = parseInt(document.getElementById('current-period').value);
        const mentalLvl = parseInt(document.getElementById('mental-load').value);
        const physicalLvl = parseInt(document.getElementById('physical-load').value);

        document.getElementById('sleep-val').innerText = sleep + '시간';
        document.getElementById('morning-val').innerText = morning + '점';
        document.getElementById('period-val').innerText = period + '교시';
        document.getElementById('mental-load-val').innerText = mentalLvl + '점';
        document.getElementById('physical-load-val').innerText = physicalLvl + '점';

        // 계산 알고리즘
        let physicalScore = Math.min(100, Math.max(0, Math.round(
            (12 - sleep) * 5 + (10 - morning) * 3 + physicalLvl * 4 + period * 2.5
        )));

        let mentalScore = Math.min(100, Math.max(0, Math.round(
            (10 - morning) * 4 + mentalLvl * 5 + (12 - sleep) * 2 + period * 2
        )));

        // 점수 렌더링
        renderScore('physical', physicalScore);
        renderScore('mental', mentalScore);

        // 다양한 AI 솔루션 다각도 매칭 알고리즘 실행
        generateDiverseAISolution(sleep, morning, period, mentalLvl, physicalLvl, physicalScore, mentalScore);
    }

    function renderScore(type, score) {
        const scoreText = document.getElementById(`${type}-score-text`);
        const fillBar = document.getElementById(`${type}-bar`);

        scoreText.innerText = `${score}점`;
        fillBar.style.width = `${score}%`;

        if (score < 40) {
            fillBar.style.backgroundColor = 'var(--success-color)';
        } else if (score < 70) {
            fillBar.style.backgroundColor = 'var(--warning-color)';
        } else {
            fillBar.style.backgroundColor = 'var(--danger-color)';
        }
    }

    // 다양한 AI 솔루션 분기 알고리즘
    function generateDiverseAISolution(sleep, morning, period, mentalLvl, physicalLvl, pScore, mScore) {
        const tag = document.getElementById('sol-tag');
        const title = document.getElementById('sol-title');
        const body = document.getElementById('sol-body');

        const maxScore = Math.max(pScore, mScore);

        // 1. 고위험 상태 (80점 이상)
        if (maxScore >= 80) {
            tag.style.backgroundColor = 'var(--danger-color)';
            if (sleep <= 4) {
                tag.innerText = "🚨 심각한 수면 부족";
                title.innerText = "관자놀이 지압 및 미온수 섭취 필요";
                body.innerHTML = "수면량이 매우 부족하여 뇌세포 피로가 누적되었습니다. <strong>1분간 관자놀이와 눈 주변 지압</strong>을 실시하고 미온수를 한 컵 마시세요. 필요시 보건실 방문을 권장합니다.";
            } else if (mentalLvl >= 8) {
                tag.innerText = "🚨 뇌 과부하 경보";
                title.innerText = "4-7-8 호흡법 & 안구 휴식";
                body.innerHTML = "과목 난이도로 인한 뇌 피로도가 한계치에 도달했습니다. <strong>4초간 숨을 마시고, 7초 멈춘 뒤, 8초간 길게 내쉬는 호흡법</strong>을 3회 반복하세요.";
            } else {
                tag.innerText = "🚨 신체 한계 상태";
                title.innerText = "전신 이완 및 척추 스트레칭";
                body.innerHTML = "신체 피로도가 극에 달했습니다. 자리에서 일어나 <strong>기지개를 크게 켜고 승모근과 척추를 이완시키는 스트레칭</strong>을 실시하세요.";
            }
            return;
        }

        // 2. 주의 상태 (50점 ~ 79점) - 원인별 세부 분석
        if (maxScore >= 50) {
            tag.style.backgroundColor = 'var(--warning-color)';
            if (period >= 6) {
                tag.innerText = "⚠️ 오후 누적 피로";
                title.innerText = "손목 털기 & 긍정 확언 마인드셋";
                body.innerHTML = "오후 수업이 이어지며 집중력이 저하되었습니다. <strong>손목과 어깨를 가볍게 털어주고 '오늘 하루도 잘 마무리하자'는 긍정 확언</strong>을 해보세요.";
            } else if (physicalLvl >= 7) {
                tag.innerText = "⚠️ 체력 소모 심함";
                title.innerText = "거북목 예방 목 둘레 스트레칭";
                body.innerHTML = "수업 중 체력 소모나 바르지 못한 자세로 목과 어깨가 경직되었습니다. <strong>고개를 천천히 좌우로 돌려주며 승모근을 풀이주는 스트레칭</strong>을 하세요.";
            } else if (mentalLvl >= 6) {
                tag.innerText = "⚠️ 정신적 과부하";
                title.innerText = "3분 안구 휴식 & 멍때리기";
                body.innerHTML = "어려운 수업으로 시각 및 정신 자극이 많았습니다. <strong>3분간 창밖의 먼 곳을 바라보거나 눈을 감고 뇌에 휴식</strong>을 주어 과부하를 해소하세요.";
            } else {
                tag.innerText = "⚠️ 아침 컨디션 저하";
                title.innerText = "지압점 자극 & 바른 자세 교정";
                body.innerHTML = "아침 컨디션 불량이 기침과 졸음으로 이어지고 있습니다. <strong>엄지와 검지 사이(합곡혈)를 지압</strong>하여 혈액순환을 촉진하세요.";
            }
            return;
        }

        // 3. 안정 상태 (49점 이하)
        tag.style.backgroundColor = 'var(--success-color)';
        tag.innerText = "✅ 최적 컨디션";
        title.innerText = "현재 훌륭한 상태 유지 중";
        body.innerHTML = "신체 및 정신 피로도가 모두 안정적입니다. <strong>주기적으로 수분을 섭취하고 바른 수면 습관을 유지</strong>하여 현재 컨디션을 계속 지켜나아 가세요.";
    }

    // 2분 리프레시 수행 버튼 클릭 처리
    function applyRefreshAction() {
        let pText = document.getElementById('physical-score-text');
        let mText = document.getElementById('mental-score-text');

        let currentP = parseInt(pText.innerText);
        let currentM = parseInt(mText.innerText);

        let newP = Math.max(10, currentP - 20);
        let newM = Math.max(10, currentM - 20);

        renderScore('physical', newP);
        renderScore('mental', newM);

        alert('⚡ 2분 맞춤 리프레시(스트레칭/명상/지압)를 완수했습니다!\n신체 및 정신 피로도가 각각 20점 감소하였습니다.');
    }

    // 페이지 시작 시 초기 계산
    window.onload = function() {
        calculateFatigue();
    };
</script>
</body>
</html>
