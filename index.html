    // 선수 필터링 및 정렬 함수
    function filterAndRenderPlayers() {
        const selectedPosition = document.getElementById('position-select').value;
        const selectedBudget = document.getElementById('budget-select').value;
        const selectedSort = document.getElementById('sort-select').value;

        // 1. 필터링
        let filtered = playersData.filter(player => {
            const matchPos = (selectedPosition === 'ALL') || (player.position === selectedPosition);
            const matchBudget = (selectedBudget === 'ALL') || (player.budgetCategory === selectedBudget);
            return matchPos && matchBudget;
        });

        // 2. 정렬
        filtered.sort((a, b) => {
            if (selectedSort === 'PRICE_ASC') return a.priceBP - b.priceBP;
            if (selectedSort === 'PRICE_DESC') return b.priceBP - a.priceBP;
            if (selectedSort === 'OVR_DESC') return b.ovr - a.ovr;
            return 0; // RECOMMEND 기본 순서
        });

        // 3. 화면 렌더링
        renderGrid(filtered);
    }

    // 카드를 DOM에 그리는 함수
    function renderGrid(list) {
        const container = document.getElementById('player-container');
        const countText = document.getElementById('result-count');

        countText.innerText = `총 ${list.length}명의 선수가 검색되었습니다.`;
        container.innerHTML = '';

        if (list.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>조건에 맞는 선수가 없습니다.</h3>
                    <p>포지션이나 예산 조건 범위를 넓혀서 다시 검색해 보세요.</p>
                </div>
            `;
            return;
        }

        list.forEach(player => {
            const card = document.createElement('div');
            card.className = 'player-card';
            card.innerHTML = `
                <div class="card-header">
                    <div class="player-identity">
                        <h3>${player.name}</h3>
                        <span class="season">${player.season}</span>
                        <span class="position">${player.position}</span>
                    </div>
                    <div class="ovr-badge">${player.ovr}</div>
                </div>

                <div class="info-row">
                    <span class="price-tag">💰 ${player.priceText}</span>
                    <span class="tier-badge">${player.tier}</span>
                </div>

                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">속가</span>
                        <span class="stat-value">${player.stats.speed}</span>
                    </div>
                    <div class="stat-item">

                        <span class="stat-value">${player.stats.shoot}</span>
                    </div>
                    <div class="stat-item">

                        <span class="stat-value">${player.stats.phys}</span>
                    </div>
                </div>

                <div class="player-desc">
                    ${player.desc}
                </div>
            `;
            container.appendChild(card);
        });
    }

    window.onload = function() {
        filterAndRenderPlayers();
